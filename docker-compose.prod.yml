services:
  app:
    image: ghcr.io/asura146/graphly-task/app:latest
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CRON_SECRET=${CRON_SECRET}
    ports:
      - "3000:3000"

  # 10分おきに定期通知エンドポイントを叩く
  scheduler:
    image: alpine:3.20
    restart: always
    environment:
      - CRON_SECRET=${CRON_SECRET}
    command:
      - sh
      - -c
      - |
        echo "*/10 * * * * wget -q -T 60 -O - --header 'Authorization: Bearer $${CRON_SECRET}' --post-data '' http://app:3000/api/cron/discord > /proc/1/fd/1 2>&1; echo > /proc/1/fd/1" > /etc/crontabs/root
        exec crond -f -l 2
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: